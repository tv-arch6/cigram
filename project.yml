name: Cigram
options:
  bundleIdPrefix: com.cigram
  deploymentTarget:
    iOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.5"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Cigram:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Cigram
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: "1.1.5"
        CFBundleVersion: "8"
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        # «الدعم والتواصل»: photos / videos / voice messages to the Cigram team (asked only when the viewer uses them;
        # without these strings iOS closes the app the moment the camera, the microphone or "Save Image" is touched)
        NSCameraUsageDescription: "لتصوير صورة أو فيديو وإرساله لفريق الدعم في «الدعم والتواصل»."
        NSMicrophoneUsageDescription: "لتسجيل رسالة صوتية لفريق الدعم في «الدعم والتواصل»."
        NSPhotoLibraryUsageDescription: "لإرسال صورة أو فيديو من صورك لفريق الدعم في «الدعم والتواصل»."
        NSPhotoLibraryAddUsageDescription: "لحفظ الصور التي يرسلها لك فريق الدعم في صورك."
        # audio: the players keep sound with the silent switch on; fetch: the background catalogue check that announces
        # new titles only once they are complete (see Notifier.swift)
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.cigram.vid.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # App Transport Security stays ON for every Cigram server (HTTPS, valid certificate, TLS 1.2+).
        # Only web players and media streams (some live channels are plain http) have an exception.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsArbitraryLoadsForMedia: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cigram.vid
