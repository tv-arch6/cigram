# Cloud build for Cigram (use when the phone/CodeAssist build gets stuck in R8).
# Put this file in your project repo at  .github/workflows/build.yml  (the project root = the folder that holds settings.gradle.kts),
# add the 4 secrets below, then: GitHub -> Actions -> "Build Cigram" -> Run workflow.
#
# Secrets (Repo -> Settings -> Secrets and variables -> Actions):
#   KEYSTORE_B64      your .jks file as base64  (Linux/Termux:  base64 -w0 cigram-upload.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Output: Actions run -> Artifacts -> cigram-build (APK for sharing, AAB for Google Play).
name: Build Cigram
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Secrets are handed over through env (never interpolated into the script text) and written to GITHUB_ENV masked.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::secret $v is empty - refusing to build an unsigned release"; exit 1; }
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cigram.jks"
          {
            echo "CIGRAM_STORE_FILE=$RUNNER_TEMP/cigram.jks"
            echo "CIGRAM_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "CIGRAM_KEY_ALIAS=$KEY_ALIAS"
            echo "CIGRAM_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # R8 (shrink + obfuscate) is ON for every release build (app/build.gradle.kts); requireSigning makes the build
      # fail instead of producing an unsigned APK when the keystore is missing.
      - name: Build (APK to share + AAB for Play)
        run: gradle --no-daemon -Pcigram.r8=true -Pcigram.requireSigning=true :app:assembleDirectRelease :app:bundlePlayRelease

      # The APK users receive must carry OUR release certificate - never the shared "Android Debug" one.
      - name: Verify signature + print the update fingerprint
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          shopt -s nullglob
          apks=(app/build/outputs/apk/direct/release/*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "::error::no release APK was produced"; exit 1; }
          for apk in "${apks[@]}"; do
            out="$("$APKSIGNER" verify --verbose --print-certs "$apk")"
            echo "$out"
            if echo "$out" | grep -qiE "CN=Android Debug"; then
              echo "::error::$apk is signed with the Android DEBUG key"; exit 1
            fi
            echo "$out" | grep -q "Verifies" || { echo "::error::$apk does not verify"; exit 1; }
            {
              echo "### $(basename "$apk")"
              echo "Put this value in the update manifest as \`sha256\` (the app refuses an update without it):"
              echo '```'
              sha256sum "$apk" | cut -d' ' -f1
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cigram-build
          path: |
            app/build/outputs/apk/direct/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/mapping/**/mapping.txt
