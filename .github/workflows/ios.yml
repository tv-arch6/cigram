name: Build Cigram iOS (IPA)
on:
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned, device SDK)
        run: |
          set -o pipefail
          xcodebuild -project Cigram.xcodeproj -scheme Cigram -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build > build.log 2>&1 || { grep -E "error:|warning: unre" build.log | head -80; tail -n 60 build.log; exit 1; }
          grep -c "warning:" build.log || true
          tail -n 15 build.log
      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -name "Cigram.app" -maxdepth 3 | head -1)
          [ -d "$APP" ] || { echo "::error::Cigram.app not found"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry Cigram-1.1.1-unsigned.ipa Payload
          ls -lh Cigram-1.1.1-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Cigram-ipa
          path: Cigram-1.1.1-unsigned.ipa

  # Launches the app in the iOS Simulator against the live catalogue and keeps screenshots (proof that it starts and loads).
  simulator-check:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Cigram.xcodeproj -scheme Cigram -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO \
            build > sim.log 2>&1 || { grep -E "error:" sim.log | head -60; tail -n 40 sim.log; exit 1; }
      - name: Run and screenshot every screen
        timeout-minutes: 25
        run: |
          set -x
          APP=$(find simbuild/Build/Products -name "Cigram.app" -maxdepth 3 | head -1)
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x.get('isAvailable') and x['name'].startswith('iPhone')]
          c.sort(key=lambda x: ('Pro' in x['name'], x['name']))
          print(c[-1]['udid'] if c else '')")
          echo "device: $DEV"
          [ -n "$DEV" ] || { echo "::error::no iPhone simulator"; exit 1; }
          xcrun simctl boot "$DEV" || true
          for i in $(seq 1 90); do
            xcrun simctl list devices | grep "$DEV" | grep -q Booted && break
            sleep 2
          done
          sleep 20
          xcrun simctl install "$DEV" "$APP"
          mkdir -p shots
          shoot() {
            xcrun simctl terminate "$DEV" com.cigram.vid || true
            xcrun simctl launch "$DEV" com.cigram.vid -cigramNoPrompt -cigramScreen "$1"
            sleep "$2"
            xcrun simctl io "$DEV" screenshot "shots/$1.png"
          }
          shoot home 45
          for s in rows details movie player channels channelplayer search account login terms; do shoot "$s" 16; done
          xcrun simctl spawn "$DEV" log show --last 12m --predicate 'process == "Cigram"' --style compact > shots/app-log.txt 2>&1 || true
          ls -la shots
          grep "CIGRAM_CHECK" shots/app-log.txt | tail -n 12 || true
          grep -iE "fatal|crash|exception" shots/app-log.txt | tail -n 8 || true
          for f in home rows details movie player channels channelplayer search account login terms; do
            sips -Z 560 -s format jpeg -s formatOptions 38 "shots/$f.png" --out "shots/$f-small.jpg" >/dev/null
            echo "SHOT_BEGIN $f"; base64 -i "shots/$f-small.jpg"; echo "SHOT_END $f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cigram-ios-simulator-check
          path: shots
